name: iOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: iOS 26 SDK build, test, and IPA
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Restore build tool caches
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-xcode26.6-tools-${{ hashFiles('project.yml', '.github/workflows/ios.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode26.6-tools-
      - name: Restore Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/StarWave/DerivedData
          key: ${{ runner.os }}-xcode26.6-derived-${{ hashFiles('project.yml', 'StarWave/**/*.swift', 'StarWaveTests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode26.6-derived-
      - name: Prepare reusable build directories
        run: mkdir -p "$HOME/Library/Caches/StarWave/DerivedData"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile app and tests
        run: >-
          xcodebuild build-for-testing
          -project StarWave.xcodeproj
          -scheme StarWave
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$HOME/Library/Caches/StarWave/DerivedData"
          CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests when a simulator runtime is available
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next((x["udid"] for runtime, values in d.items() if ".iOS-" in runtime for x in values if x.get("isAvailable")), ""))')"
          if [ -n "$DEVICE_ID" ]; then
            xcodebuild test-without-building -project StarWave.xcodeproj -scheme StarWave -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath "$HOME/Library/Caches/StarWave/DerivedData" CODE_SIGNING_ALLOWED=NO
          else
            echo "::warning::No iOS Simulator runtime is installed; build-for-testing completed, runtime tests skipped."
          fi
      - name: Build re-signable app
        run: >-
          xcodebuild archive
          -project StarWave.xcodeproj
          -scheme StarWave
          -configuration Release
          -sdk iphoneos
          -archivePath "$RUNNER_TEMP/StarWave.xcarchive"
          -derivedDataPath "$HOME/Library/Caches/StarWave/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/StarWave.xcarchive/Products/Applications/StarWave.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry StarWave-resignable.ipa Payload
          shasum -a 256 StarWave-resignable.ipa > StarWave-resignable.ipa.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarWave-resignable
          path: |
            ${{ runner.temp }}/StarWave-resignable.ipa
            ${{ runner.temp }}/StarWave-resignable.ipa.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$RUNNER_TEMP/StarWave-resignable.ipa" "$RUNNER_TEMP/StarWave-resignable.ipa.sha256" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$RUNNER_TEMP/StarWave-resignable.ipa" "$RUNNER_TEMP/StarWave-resignable.ipa.sha256" --generate-notes
          fi

  legacy-compatibility:
    name: iOS 16 compatibility compile
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Restore build tool caches
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-xcode16.4-tools-${{ hashFiles('project.yml', '.github/workflows/ios.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode16.4-tools-
      - name: Restore Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/StarWave/DerivedData
          key: ${{ runner.os }}-xcode16.4-derived-${{ hashFiles('project.yml', 'StarWave/**/*.swift', 'StarWaveTests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode16.4-derived-
      - name: Prepare reusable build directories
        run: mkdir -p "$HOME/Library/Caches/StarWave/DerivedData"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile legacy fallback and tests
        run: >-
          xcodebuild build-for-testing
          -project StarWave.xcodeproj
          -scheme StarWave
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$HOME/Library/Caches/StarWave/DerivedData"
          CODE_SIGNING_ALLOWED=NO
